server {
    listen 80;
    server_name _;

    # Usa o DNS interno do Docker e resolve os upstreams em tempo de requisição,
    # em vez de travar na inicialização se um serviço ainda não subiu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → FastAPI. O prefixo /api/ é removido antes de repassar ao backend.
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # Restante → app React (servido pelo nginx interno do container frontend).
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
